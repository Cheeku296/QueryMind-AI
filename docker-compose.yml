version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: querymind-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: querymind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: querymind-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: querymind-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querymind-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/querymind
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/querymind
      DEMO_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/querymind_demo
      ASYNC_DEMO_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/querymind_demo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querymind-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    restart: always
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/querymind
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/querymind
      DEMO_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/querymind_demo
      ASYNC_DEMO_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/querymind_demo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: querymind-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
